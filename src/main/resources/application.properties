spring.application.name=study-java

server.port=8080
server.servlet.context-path=/api/v1

# Database Configuration (H2 In-Memory for zero-config local dev)
spring.datasource.url=jdbc:h2:mem:netflixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Setup (Uncomment to use local PostgreSQL service)
# spring.datasource.url=jdbc:postgresql://localhost:5432/study_java
